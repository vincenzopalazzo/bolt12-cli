[package]
name = "bolt12-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Swiss army knife CLI for BOLT12 offers, invoices, and payer proofs"
readme = "../README.md"
documentation = "https://docs.rs/bolt12-cli"
homepage = "https://github.com/vincenzopalazzo/bolt12-cli"
keywords = ["bitcoin", "lightning", "bolt12"]
categories = ["command-line-utilities"]

[[bin]]
name = "bolt12"
path = "src/main.rs"

[dependencies]
bolt12-common = { path = "../bolt12-common", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
