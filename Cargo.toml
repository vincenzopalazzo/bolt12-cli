[workspace]
resolver = "2"
members = ["bolt12-common", "bolt12-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vincenzopalazzo/bolt12-cli"
authors = ["Vincenzo Palazzo <vincenzopalazzodev@gmail.com>"]

[workspace.dependencies]
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
lightning = { version = "0.3.0-rc1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
